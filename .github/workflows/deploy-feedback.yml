# 통합 의견함(Cloudflare Worker) 자동 배포
# 처음 한 번: GitHub 저장소 Settings → Secrets and variables → Actions 에
#   FEEDBACK_ADMIN_KEY (선생님만 아는 관리 열쇠, 영어·숫자 12자 이상) 를 등록한 뒤
#   Actions 탭 → "Deploy feedback" → Run workflow 를 누르면 배포됩니다.
# (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 는 방 코드 릴레이 때 이미 등록해 둔 것을 그대로 써요.)
name: Deploy feedback
on:
  workflow_dispatch:
  push:
    paths: ['feedback/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: feedback
          command: deploy
          secrets: |
            ADMIN_KEY
        env:
          ADMIN_KEY: ${{ secrets.FEEDBACK_ADMIN_KEY }}
